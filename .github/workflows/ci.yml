name: CI

# Pull-request checks: the merge gate. No AWS access here — deploys happen
# only from main via deploy.yml.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Claims-policy lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://www.furnacewatch.io
          PUBLIC_APP_URL: https://app.furnacewatch.io
